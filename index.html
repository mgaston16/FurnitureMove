function signFor(which){
  var label = which === "pickup" ? "Pickup" : "Delivery";
  var sh = openSheet(
    '<h2>' + label + ' signature</h2>' +
    '<p>Have the customer sign below to confirm the manifest at ' + label.toLowerCase() + '.</p>' +
    '<input type="text" id="sigName" placeholder="Printed name" value="' +
      esc((currentJob()["sig" + which] || {}).name || "") + '">' +
    '<canvas id="sigPad" width="600" height="220"></canvas>' +
    '<div class="row"><button class="btn" id="sigSave">Save signature</button>' +
    '<button class="btn ghost" id="sigClear">Clear</button></div>',
    function(sheet){
      var cv = sheet.querySelector("#sigPad");
      var ctx = cv.getContext("2d");
      ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#16211F";
      var drawing = false, blank = true;
      function pos(e){
        var r = cv.getBoundingClientRect();
        var p = e.touches ? e.touches[0] : e;
        return {x:(p.clientX - r.left) * (cv.width / r.width),
                y:(p.clientY - r.top) * (cv.height / r.height)};
      }
      function start(e){ drawing = true; blank = false; var q = pos(e); ctx.beginPath(); ctx.moveTo(q.x, q.y); e.preventDefault(); }
      function move(e){ if (!drawing) return; var q = pos(e); ctx.lineTo(q.x, q.y); ctx.stroke(); e.preventDefault(); }
      function end(){ drawing = false; }
      cv.addEventListener("mousedown", start); cv.addEventListener("mousemove", move);
      window.addEventListener("mouseup", end);
      cv.addEventListener("touchstart", start, {passive:false});
      cv.addEventListener("touchmove", move, {passive:false});
      cv.addEventListener("touchend", end);
      sheet.querySelector("#sigClear").addEventListener("click", function(){
        ctx.clearRect(0, 0, cv.width, cv.height); blank = true;
      });
      sheet.querySelector("#sigSave").addEventListener("click", async function(){
        if (blank){ toast("Nothing signed yet"); return; }
        var data = cv.toDataURL("image/png");
        var pid = uid("sig");
        var c = pickChunk(data.length + 40);
        chunks[c][pid] = data; images[pid] = data;
        var j = currentJob();
        j["sig" + which] = {id:pid, chunk:c, url:"",
          name: sheet.querySelector("#sigName").value.trim(), when: Date.now()};
        await saveChunk(c);
        if (cloudOn()){
        }
        await saveGlobal();
        (sheet.shut ? sheet.shut() : sheet.remove());
        toast(label + " signature saved");
      });
    });
  return sh;
}

      i.from === BUY_ID ? "To buy" : nameOf("from", i.from, i.fromKid),

function showTour(){

  el.className = "tour";
  document.body.appendChild(el);
  function paint(){
    var t = TOUR[i];
    el.innerHTML = '<div class="tour-in">' +
      '<h2>' + esc(t.h) + '</h2><p>' + esc(t.p) + '</p>' +
      '<div class="demoart">' + t.art + '</div>' +
      '<div class="tour-nav"><div class="dots">' +
        TOUR.map(function(_, n){ return '<i class="' + (n === i ? "on" : "") + '"></i>'; }).join("") +
      '</div>' +
      (i > 0 ? '<button class="btn ghost" data-t="back">Back</button>' : '') +
      '<button class="btn" data-t="next">' + (i === TOUR.length - 1 ? "Start" : "Next") + '</button>' +
      '</div></div>';
    el.querySelectorAll("[data-t]").forEach(function(b){
      b.addEventListener("click", function(){
        if (b.dataset.t === "back"){ i--; paint(); return; }
        if (i < TOUR.length - 1){ i++; paint(); return; }
        el.remove();
        account.onboarded = true;
        saveMeta(true);
        if (i === TOUR.length - 1) setTimeout(function(){ $("#settingsBtn").focus(); }, 100);
      });
    });
  }
  paint();

    var el = document.createElement("div");
    el.className = "jpick";
    document.body.appendChild(el);
    var list = sortedJobs().filter(function(j){ return !j.archived; });
    var busy = false;

    el.innerHTML = '<div class="jpick-in">' +
      '<h2>Which job are you on?</h2>' +
      '<p>This project already has ' + list.length + ' job' + (list.length === 1 ? "" : "s") +
        ' in it. Open the one you were sent, or start a fresh one of your own — ' +
        'jobs never see each other’s pieces or photos.</p>' +
      '<div class="jpick-list">' + list.map(function(j){
        return '<button class="jpick-row" data-pick="' + esc(j.id) + '">' +
          '<span class="jpick-name">' + esc(j.name) +
            (j.closed ? ' <span class="badge closed">Complete</span>' : '') + '</span>' +
          '<span class="jpick-sub" data-sub="' + esc(j.id) + '">' +
            esc(j.client ? j.client + " · " : "") + esc(moveDateLabel(j)) + '</span>' +
          '</button>';
      }).join("") + '</div>' +
      '<div class="jpick-or">or</div>' +
      '<input type="text" id="pickName" placeholder="Name a new job — e.g. Mom’s house" ' +
        'autocapitalize="words">' +
      '<div class="row"><button class="btn ghost" id="pickNew">Start a new job</button></div>' +
      '<div class="status" id="pickMsg" hidden></div>' +
      '<div class="stub">You can switch jobs any time from the name at the top of the screen.</div>' +
      '</div>';

    var msg = el.querySelector("#pickMsg");
    function say(txt, cls){
      msg.hidden = false;
      msg.className = "status" + (cls ? " " + cls : "");
      msg.textContent = txt;
    }
    async function settle(how){
      try { await store.set("fm:picked", "1"); } catch(e){}
      el.remove();
      done(how);
    }

    Array.prototype.forEach.call(el.querySelectorAll("[data-pick]"), function(b){
      b.addEventListener("click", async function(){
        if (busy) return;
        busy = true;
        b.classList.add("loading");
        var id = b.dataset.pick;
        try{
          if (id !== jobId) await openJob(id);
          else { try { await store.set("fm:lastjob", jobId); } catch(e){} }
        }catch(e){
          busy = false;
          b.classList.remove("loading");
          say("That job would not open. Check your connection and try again.", "no");
          return;
        }
        await settle("open");
      });
    });

    el.querySelector("#pickNew").addEventListener("click", async function(){
      if (busy) return;
      var name = el.querySelector("#pickName").value.trim();
      if (!name){ say("Give the new job a name first.", "no"); return; }
      busy = true;
      var made = null;
      try { made = await createJob(name, ""); } catch(e){}
      if (!made){
        busy = false;
        say("This account has used all the jobs on its plan. Open one of the jobs above, " +
            "or ask whoever set this up for a code.", "no");
        return;
      }
      await settle("new");
    });

    /* Piece counts make the choice obvious, but they need a round trip each,
       so fill them in after the list is already on screen. */
    list.slice(0, 8).forEach(function(j){
      jobCountRemote(j).then(function(n){
        if (n == null) return;
        var sub = el.querySelector('[data-sub="' + j.id + '"]');
        if (!sub) return;
        sub.textContent = n + " piece" + (n === 1 ? "" : "s") + " · " +
          (j.client ? j.client + " · " : "") + moveDateLabel(j);
      }).catch(function(){});
    });
  });
}

function startOnboarding(){
  if (account.onboarded) { checkPlan(); return; }
  if (!items.length){
    items.push(demoItem());
    render();
  }
  showTour();
}

async function firstRun(){
  if (needsChooser){
    var how = await showJobChooser();
    needsChooser = false;
    renderFoot();
    checkPlan();
    /* Someone opening a list that is already full of pieces does not need the
       walkthrough. Someone starting their own job does, even though the shared
       account was marked onboarded long ago by whoever set it up. */
    if (how === "new"){
      account.onboarded = false;
      startOnboarding();
    } else if (!realItems().length){
      startOnboarding();
    } else {
      account.onboarded = true;
      saveMeta(true);
    }
    return;
  }
  startOnboarding();
}

load().then(firstRun);
</script>
</body>
