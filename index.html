<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoveIT">
<title>MoveIT Manifest</title>
<style>
  :root{
    --ink:#16211F; --ink-soft:#4C5A57; --paper:#EEF1EE; --card:#FFFFFF; --line:#D2D9D5;
    --lake:#2E6E6B; --lake-soft:#E2EFEE; --hold:#9A6516; --sell:#8C3A3A; --give:#4A5E8C;
    --buy:#6E5390; --ghost:#8A9793;
    --shadow:0 1px 2px rgba(22,33,31,.06), 0 8px 20px rgba(22,33,31,.06);
    --tag:"Avenir Next Condensed","Avenir Next","Oswald","Segoe UI",system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  /* Author display rules outrank the UA rule for [hidden], so state it explicitly. */
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;
       -webkit-font-smoothing:antialiased;padding-bottom:200px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:20;background:rgba(238,241,238,.94);
         backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);
         padding-top:env(safe-area-inset-top)}
  .head-row{display:flex;align-items:flex-end;gap:12px;padding:13px 0 9px}
  h1{font-family:var(--tag);font-size:25px;letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1;font-weight:600}
  .sub{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .jobline{display:block;text-align:left;background:none;border:none;padding:4px 0 0;
    font-family:var(--body);font-size:12px;color:var(--ink-soft);cursor:pointer}
  .jobline b{font-family:var(--tag);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .jobline .chev{color:var(--ghost);margin-left:4px}
  .head-actions{margin-left:auto;display:flex;gap:7px;align-items:center;flex-shrink:0}
  .save-dot{font-family:var(--tag);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ghost);white-space:nowrap}
  .save-dot.on{color:var(--lake)}

  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:2px;padding:10px 14px;
       font-family:var(--tag);letter-spacing:.1em;text-transform:uppercase;font-size:12px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.sm{padding:7px 9px;font-size:11px}
  .btn[disabled]{opacity:.35}

  .warn{background:var(--sell);color:#fff;padding:10px 14px;font-size:13px;line-height:1.4}
  .warn button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:2px;
    font-size:11px;padding:3px 7px;margin-left:8px;font-family:var(--tag);letter-spacing:.1em;text-transform:uppercase}

  .findrow{padding:0 0 8px;display:flex;gap:6px}
  .findrow .btn{flex:0 0 auto}
  .findrow .btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lake);margin-left:5px;vertical-align:middle}
  .findrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:2px;padding:9px 11px;
                 font-family:var(--body);font-size:15px;background:#fff;color:var(--ink)}
  .findrow input:focus{outline:none;border-color:var(--ink)}
  .toolrow{display:flex;gap:6px;padding:0 0 9px;flex-wrap:wrap}
  .toolrow .btn{flex:1}

  .pickrow{display:flex;gap:6px;padding:0 0 9px}
  .pickrow select{flex:1;min-width:0;border:1px solid var(--line);border-radius:2px;padding:9px 8px;
    background:#fff;color:var(--ink);font-family:var(--body);font-size:14px}
  .pickrow select:focus{outline:none;border-color:var(--ink)}
  .pickrow select.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .rail{display:flex;gap:6px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail button{flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:2px;
    padding:7px 11px;color:var(--ink-soft);font-family:var(--tag);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .rail button .c{font-family:var(--num);letter-spacing:0;font-size:11px;opacity:.7;margin-left:6px}
  .rail button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 0 0}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);
        overflow:hidden;display:flex;flex-direction:column;animation:rise .24s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.card{animation:none}}
  .card.picked{border-color:var(--lake);box-shadow:0 0 0 2px var(--lake)}
  .card.wish{border-color:var(--buy)}

  .shot{position:relative;background:#DDE3E0;aspect-ratio:4/3;overflow:hidden}
  .shot.blank{background:repeating-linear-gradient(45deg,#E9EDEA,#E9EDEA 10px,#E3E8E5 10px,#E3E8E5 20px)}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .addphoto{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;
    color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .addphoto .em{font-size:38px;line-height:1;filter:saturate(.55) opacity(.75)}
  .addphoto .hint{font-family:var(--tag);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .tagno{position:absolute;left:0;top:0;background:var(--ink);color:#fff;font-family:var(--num);font-size:12px;padding:5px 9px}
  .nowban{position:absolute;left:0;top:26px;background:rgba(22,33,31,.88);color:#fff;font-family:var(--tag);
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;max-width:80%}
  .nowban.buy{background:var(--buy)}
  .qtybadge{position:absolute;left:0;top:56px;background:var(--ink-soft);color:#fff;font-family:var(--num);font-size:11px;padding:3px 8px}
  .buytag{position:absolute;left:0;bottom:0;background:var(--buy);color:#fff;font-family:var(--tag);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px}
  .kill{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:none;
        background:rgba(22,33,31,.55);color:#fff;font-size:16px;display:grid;place-items:center}
  .tick{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;
        border:2px solid #fff;background:rgba(22,33,31,.45);color:#fff;font-size:17px;display:grid;place-items:center}
  .tick.on{background:var(--lake)}
  .tick.big{width:56px;height:56px;font-size:27px;right:10px;top:10px}
  .delivered{position:absolute;right:6px;top:6px;background:var(--lake);color:#fff;font-family:var(--tag);
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:2px}
  .card.arrived{opacity:.72}
  .stamp{position:absolute;right:0;bottom:0;padding:6px 10px;font-family:var(--tag);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:#fff;max-width:78%;text-align:right}
  .stamp.lake{background:var(--lake)} .stamp.hold{background:var(--hold)}
  .stamp.sell{background:var(--sell)} .stamp.give{background:var(--give)}
  .stamp.buy{background:var(--buy)}

  .body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:11px}
  textarea.desc{width:100%;border:none;border-bottom:1px dashed var(--line);background:transparent;
    font-family:var(--body);font-size:16px;color:var(--ink);resize:none;padding:2px 0 7px;line-height:1.35;overflow:hidden}
  textarea.desc:focus{outline:none;border-bottom-color:var(--ink)}
  .mic{float:right;margin-top:-30px;position:relative;z-index:2}
  textarea.desc::placeholder{color:var(--ghost)}

  .field{display:flex;flex-direction:column;gap:6px}
  .lbl{font-family:var(--tag);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ghost)}
  .lbl.needs{color:var(--lake);font-weight:600}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{border:1px solid var(--line);background:transparent;border-radius:2px;padding:8px 10px;font-size:13px;color:var(--ink-soft);line-height:1.1}
  .opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .opt.lake[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:#fff}
  .opt.hold[aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:#fff}
  .opt.sell[aria-pressed="true"]{background:var(--sell);border-color:var(--sell);color:#fff}
  .opt.give[aria-pressed="true"]{background:var(--give);border-color:var(--give);color:#fff}
  .opt.buy[aria-pressed="true"]{background:var(--buy);border-color:var(--buy);color:#fff}
  .opt.flag-fragile[aria-pressed="true"]{background:var(--sell);border-color:var(--sell);color:#fff}
  .opt.flag-heavy[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .opt.flag-urgent[aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:#fff}
  .flagtag{position:absolute;right:0;top:0;font-family:var(--tag);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:#fff;padding:4px 8px}
  .flagtag.fragile{background:var(--sell)} .flagtag.heavy{background:var(--ink)}
  .flagtag.urgent{background:var(--hold)}
  .kidwrap{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid var(--line)}
  .kidwrap .opt[aria-pressed="true"]{background:var(--lake-soft);border-color:var(--lake);color:var(--lake);font-weight:600}
  .kidopt{display:flex;align-items:center;gap:8px}
  .kidopt img{width:34px;height:26px;object-fit:cover;border-radius:2px;flex:0 0 auto}

  .dims{display:flex;gap:6px;align-items:center}
  .dims input{width:100%;min-width:0;border:1px solid var(--line);border-radius:2px;padding:7px 8px;
    font-family:var(--num);font-size:14px;text-align:center;background:#fff;color:var(--ink)}
  .dims span{color:var(--ghost);font-size:12px}
  .dims input:focus,.notes:focus{outline:none;border-color:var(--ink)}
  .contents{width:100%;border:1px solid var(--line);border-radius:2px;padding:7px 9px;
    font-family:var(--body);font-size:14px;background:#fff;color:var(--ink);resize:none;overflow:hidden;line-height:1.35}
  .contents:focus{outline:none;border-color:var(--ink)}
  .notes{width:100%;border:1px solid var(--line);border-radius:2px;padding:7px 9px;
    font-family:var(--body);font-size:14px;background:#fff;color:var(--ink);resize:none;overflow:hidden;line-height:1.35}
  .more{background:none;border:none;padding:0;color:var(--ink-soft);font-family:var(--tag);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:left}
  .extra{display:none;flex-direction:column;gap:11px} .extra.show{display:flex}
  .strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .thumb{position:relative;width:62px;height:47px;border-radius:2px;overflow:hidden;display:block;
    background:var(--paper);border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.cond{border-color:var(--sell)}
  .thumb b{position:absolute;left:0;bottom:0;right:0;background:var(--sell);color:#fff;font-family:var(--tag);
    font-size:8px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:1px 0}
  .thumb .wait{display:grid;place-items:center;height:100%;color:var(--ghost);font-size:16px}
  .thumb .rm{position:absolute;right:1px;top:1px;width:17px;height:17px;border:none;border-radius:50%;
    background:rgba(22,33,31,.65);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
  .row2{display:flex;gap:6px;flex-wrap:wrap}
  .mic{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:0 4px}
  .mic.on{color:var(--sell)}

  .nomatch{border:1px dashed var(--line);border-radius:3px;background:var(--card);padding:24px 18px;
    text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.5;margin-top:16px}
  .nomatch .btn{display:block;margin:14px auto 0}
  .empty{border:1px dashed var(--line);border-radius:3px;background:var(--card);padding:34px 22px;text-align:center;margin-top:18px}
  .empty h2{font-family:var(--tag);font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
  .empty p{margin:0 auto 18px;max-width:40ch;color:var(--ink-soft);font-size:14px;line-height:1.5}

  .board-group{margin:0 0 26px}
  .board-head{font-family:var(--tag);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
    border-bottom:2px solid var(--ink);padding-bottom:6px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .board-head .ord{background:var(--ink);color:#fff;font-size:11px;letter-spacing:.1em;padding:3px 7px;border-radius:2px}
  .board-head .n{margin-left:auto;color:var(--ink-soft);font-family:var(--num);font-size:12px;letter-spacing:0}
  .board-head img{width:44px;height:33px;object-fit:cover;border-radius:2px}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:620px){.board{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:980px){.board{grid-template-columns:repeat(4,1fr)}}
  .tile{background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;
    box-shadow:var(--shadow);text-align:left;padding:0;display:block;width:100%}
  .tile.wish{border-color:var(--buy)}
  .tile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .blanktile .em{display:block;font-size:26px;line-height:1;margin-bottom:6px;filter:saturate(.55) opacity(.75)}
  .blanktile{aspect-ratio:4/3;display:grid;place-items:center;padding:10px;text-align:center;
    color:var(--ghost);font-size:12px;line-height:1.35;
    background:repeating-linear-gradient(45deg,#F3F5F3,#F3F5F3 10px,#EDF0EE 10px,#EDF0EE 20px)}
  .tile figcaption{padding:7px 9px;font-size:12.5px;line-height:1.35;color:var(--ink)}
  .tile .cap-n{font-family:var(--num);font-size:11px;color:var(--ghost)}
  .tile .cap-buy{display:block;color:var(--buy);font-family:var(--tag);font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;margin-top:3px}

  .roomview{position:fixed;inset:0;z-index:55;background:var(--paper);overflow-y:auto;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
  .rv-in{max-width:1180px;margin:0 auto}
  .rv-top{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
  .rv-top h2{font-family:var(--tag);font-size:24px;letter-spacing:.05em;text-transform:uppercase;
    margin:0;line-height:1.05}
  .rv-top .sub{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .rv-top .btn{margin-left:auto;flex:0 0 auto}
  .rv-hero{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:3px;
    margin:0 0 14px;box-shadow:var(--shadow)}
  .rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(min-width:620px){.rv-grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:980px){.rv-grid{grid-template-columns:repeat(4,1fr)}}
  .rv-grid button{padding:0;border:none;background:none;display:block}
  .rv-grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px;
    box-shadow:var(--shadow)}
  .rv-none{margin-top:16px;font-size:13px;color:var(--ghost);line-height:1.6}
  .rv-none b{font-family:var(--num);font-size:12px;color:var(--ink-soft);font-weight:400}
  .rv-empty{border:1px dashed var(--line);border-radius:3px;padding:30px;text-align:center;
    color:var(--ink-soft);font-size:14px;line-height:1.5;background:#fff}
  .board-head{cursor:pointer}
  .board-head .eye{font-family:var(--tag);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:2px;padding:3px 7px;color:var(--ink-soft);background:#fff}

  .pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 0 4px}
  .pager span{font-family:var(--num);font-size:13px;color:var(--ink-soft)}
  footer{padding:22px 0 8px;color:var(--ghost);font-size:12px;line-height:1.6;text-align:center}
  footer .vow{color:var(--ink-soft)}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:#fff;
       padding:11px 14px calc(50px + env(safe-area-inset-bottom))}
  .bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tally{font-family:var(--tag);font-size:13px;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;flex:1 1 100%}
  .tally b{font-family:var(--num);letter-spacing:0;font-weight:600}
  .tally small{display:block;font-family:var(--body);font-size:11px;letter-spacing:0;text-transform:none;color:#A9BAB6;margin-top:2px}
  .tally small.risk{color:#FF9C9C;font-weight:600}
  .bar .btn{background:transparent;color:#fff;border-color:#4A5A57}
  .bar .btn.solid{background:#fff;color:var(--ink);border-color:#fff}

  .bulk{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--lake);color:#fff;
        padding:11px 14px calc(50px + env(safe-area-inset-bottom))}
  .bulk .lbl{color:#CDE5E3;flex:1 1 100%}
  .bulk .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  .bulk select{flex:1 1 100%;padding:10px;border-radius:2px;border:1px solid rgba(255,255,255,.5);
    background:#fff;color:var(--ink);font-family:var(--body);font-size:15px}

  .toast{position:fixed;left:14px;right:14px;bottom:calc(160px + env(safe-area-inset-bottom));z-index:40;
    background:var(--ink);color:#fff;border-radius:3px;padding:12px 14px;display:flex;align-items:center;
    gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px}
  .toast button{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:2px;
    padding:6px 11px;font-family:var(--tag);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-left:auto}

  .sheet{position:fixed;left:0;right:0;top:0;bottom:0;height:100dvh;z-index:70;
    background:rgba(22,33,31,.5);display:flex;align-items:flex-end;justify-content:center;
    overscroll-behavior:contain}
  .sheet-in{background:var(--paper);width:100%;max-width:620px;max-height:86dvh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    border-radius:8px 8px 0 0;padding:18px 16px calc(86px + env(safe-area-inset-bottom))}
  .sheet-done{display:block;width:100%;margin-top:18px}
  body.locked{overflow:hidden;position:relative}
  .sheet h2{font-family:var(--tag);font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
  .promise{background:var(--lake-soft);border:1px solid var(--lake);border-radius:3px;
    padding:14px;margin:16px 0 6px}
  .promise h3.first{margin-top:0;border:none;color:var(--lake);padding-bottom:2px}
  .promise p{color:var(--ink);font-size:13.5px}
  .promise .btn{flex:1;min-width:120px}
  .promise .small{font-size:12px;color:var(--ink-soft);margin:2px 0 0}
  .sheet .small{font-size:12px;color:var(--ink-soft);line-height:1.5}
  .steps{margin:0 0 10px;padding-left:20px;font-size:13.5px;line-height:1.65;color:var(--ink)}
  .steps li{margin-bottom:5px}
  .sheet h3{font-family:var(--tag);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);color:var(--ink-soft)}
  .sheet p{font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 10px}
  .sheet label{display:block;font-family:var(--tag);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ghost);margin:0 0 4px}
  #sigPad{width:100%;height:180px;background:#fff;border:1px dashed var(--line);border-radius:3px;
    touch-action:none;margin-bottom:11px;display:block}
  .sheet input[type=text],.sheet textarea{width:100%;border:1px solid var(--line);border-radius:2px;
    padding:9px 10px;font-family:var(--num);font-size:13px;background:#fff;color:var(--ink);margin-bottom:11px}
  .sheet textarea{font-family:var(--body);font-size:15px;line-height:1.5;resize:vertical}

<script>
/* ===================== places model ===================== */
function uid(p){ return (p||"p") + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

var DEFAULT_SITES = [
  {id:"o-current", name:"Current house", pickup:true, dropoff:false, address:"", notes:"", kids:[]},
  {id:"d-new", name:"New house", pickup:false, dropoff:true, address:"", notes:"", kids:[
    {id:"r-primary", name:"Primary bedroom"},
    {id:"r-bed2", name:"Bedroom 2"},
    {id:"r-bed3", name:"Bedroom 3"},
    {id:"r-living", name:"Living room"},
    {id:"r-dining", name:"Dining room"},
    {id:"r-kitchen", name:"Kitchen"},
    {id:"r-office", name:"Office"},
    {id:"r-basement", name:"Basement"},
    {id:"r-garage", name:"Garage"}
  ]},
  {id:"o-unit", name:"Storage unit", pickup:true, dropoff:true, address:"", notes:"", kids:[
    {id:"u-keep", name:"Keep pile"},
    {id:"u-sell", name:"Sell pile"}
  ]},
  {id:"d-donate", name:"Donate", pickup:false, dropoff:true, address:"", notes:"", kids:[]},
  {id:"buy", name:"Need to buy", pickup:true, dropoff:false, address:"", notes:"", kids:[]}
];

var TONES = ["lake","hold","sell","give","buy"];
var BUY_ID = "buy";

function clonePlaces(p){ return JSON.parse(JSON.stringify(p)); }

/* One list of sites; a site can be a pickup, a drop-off, or both. */
function allSites(){ return (places && places.sites) || []; }
function listOf(kind){
  return allSites().filter(function(s){ return kind === "from" ? s.pickup : s.dropoff; });
}
function findPlace(kind, id){
  var l = allSites();
  for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
  return null;
}
/* Drop-off order is the order drop-off sites appear in the list.
   Loading a truck runs backwards: last stop goes in first. */
function dropOrder(id){
  var l = listOf("to").map(function(s){ return s.id; });
  var i = l.indexOf(id);
  return i < 0 ? 999 : i + 1;
}
function normalizePlaces(p){
  if (!p) return {sites: clonePlaces(DEFAULT_SITES)};
  if (p.sites && p.sites.length) return p;
  if (p.origins || p.dests){
    var out = [];
    (p.origins || []).forEach(function(o){
      out.push({id:o.id, name:o.name, pickup:true, dropoff:false, address:"", notes:"", kids:o.kids || []});
    });
    (p.dests || []).forEach(function(d){
      var same = out.filter(function(x){ return x.name === d.name; })[0];
      if (same && !(same.kids||[]).length && !(d.kids||[]).length){ same.dropoff = true; return; }
      out.push({id:d.id, name:d.name, pickup:false, dropoff:true, address:"", notes:"", kids:d.kids || []});
    });
    return {sites: out};
  }
  return {sites: clonePlaces(DEFAULT_SITES)};
}
function findKid(kind, id, kidId){
  var p = findPlace(kind, id);
  if (!p) return null;
  var k = p.kids || [];
  for (var i = 0; i < k.length; i++) if (k[i].id === kidId) return k[i];
  return null;
}
function nameOf(kind, id, kidId){
  var p = findPlace(kind, id);
  if (!p) return "";
  var k = kidId ? findKid(kind, id, kidId) : null;
  return k ? p.name + " \u2014 " + k.name : p.name;
}
function toneOf(id){
  var i = listOf("to").map(function(p){ return p.id; }).indexOf(id);
  return i < 0 ? "hold" : TONES[i % TONES.length];
}
function everyLeaf(kind){
  var out = [];
  listOf(kind).forEach(function(p){
    if ((p.kids||[]).length) p.kids.forEach(function(k){ out.push({top:p, kid:k}); });
    else out.push({top:p, kid:null});
  });
  return out;
}
function placeRefs(){
  var out = [];
  allSites().forEach(function(p){
    (p.kids||[]).forEach(function(k){
      if (k.photoId) out.push({id:k.photoId, chunk:k.chunk, url:k.url});
    });
  });
  return out;
}
/* Internal ids look like "d-new", "r-bed2", "buy" or "pkmu1l4p1dw6y".
   Anything else that turns up in a from/to field is a human place name from
   an older save, and is worth keeping. */
function looksLikeId(v){
  v = String(v || "");
  return v === "buy" || /^[a-z]{1,2}-[a-z0-9]+$/.test(v) || /^[pki][a-z0-9]{8,}$/.test(v);
}
var NAME_ALIAS = {"to buy":"Need to buy", "need to buy":"Need to buy"};
function siteByName(name){
  var want = String(name || "").trim().toLowerCase();
  want = NAME_ALIAS[want] ? NAME_ALIAS[want].toLowerCase() : want;
  var l = allSites();
  for (var i = 0; i < l.length; i++){
    if (String(l[i].name).trim().toLowerCase() === want) return l[i];
  }
  return null;
}
/* Find the site by name, or add it. Never silently drop a destination. */
var adoptedLegacy = false;
function ensureSite(name, kind){
  var hit = siteByName(name);
  if (!hit){
    adoptedLegacy = true;
    hit = {id: uid("p"), name: String(name).trim(), pickup:false, dropoff:false,
           address:"", notes:"", kids:[]};
    places.sites.push(hit);
  }
  if (kind === "from") hit.pickup = true; else hit.dropoff = true;
  return hit;
}
function ensureKid(site, name){
  site.kids = site.kids || [];
  var want = String(name || "").trim().toLowerCase();
  for (var i = 0; i < site.kids.length; i++){
    if (String(site.kids[i].name).trim().toLowerCase() === want) return site.kids[i];
  }
  var k = {id: uid("k"), name: String(name).trim()};
  site.kids.push(k);
  return k;
}

function migrateItem(it){
  if (it.from && !findPlace("from", it.from)){
    var o = siteByName(it.from);
    it.from = o ? o.id : (looksLikeId(it.from) ? "" : ensureSite(it.from, "from").id);
  }
  if (it.to && !findPlace("to", it.to)){
    var d = siteByName(it.to);
    it.to = d ? d.id : (looksLikeId(it.to) ? "" : ensureSite(it.to, "to").id);
  }
  if (it.room && it.to){
    var site = findPlace("to", it.to);
    if (site && !it.toKid) it.toKid = ensureKid(site, it.room).id;
    delete it.room;
  }
  /* A site that is actually in use must offer itself in the right list. */
  var fs = it.from ? findPlace("from", it.from) : null;
  if (fs && !fs.pickup) fs.pickup = true;
  var ds = it.to ? findPlace("to", it.to) : null;
  if (ds && !ds.dropoff) ds.dropoff = true;
  if (!it.toKid) it.toKid = "";
  if (!it.fromKid) it.fromKid = "";
  return it;
}
function sitesToText(list){
  return list.map(function(p){
    return p.name + (p.kids||[]).map(function(k){ return "\n  " + k.name; }).join("");
  }).join("\n");
}
function textToSites(txt, existing){
  var lines = txt.split("\n").filter(function(l){ return l.trim().length; });
  var names = lines.map(function(l){ return l.replace(/^[-\s]+/, "").trim(); });
  var out = [], cur = null, ti = 0;
  function reuseId(pool, name, idx){
    var hit = pool.filter(function(x){ return x.name === name; })[0];
    if (hit) return hit.id;
    var pos = pool[idx];
    if (pos && names.indexOf(pos.name) < 0) return pos.id;
    return null;
  }
  lines.forEach(function(raw){
    var child = /^(\s\s|\t|-\s?)/.test(raw);
    var name = raw.replace(/^[-\s]+/, "").trim();
    if (!name) return;
    if (!child || !cur){
      var keepId = reuseId(existing, name, ti) || uid("p");
      var was = existing.filter(function(x){ return x.id === keepId; })[0] || {};
      cur = {id:keepId, name:name, kids:[],
             pickup: was.pickup !== undefined ? was.pickup : true,
             dropoff: was.dropoff !== undefined ? was.dropoff : true,
             address: was.address || "", notes: was.notes || ""};
      out.push(cur); ti++;
    } else {
      var prevTop = existing.filter(function(x){ return x.id === cur.id; })[0];
      var pool = prevTop ? (prevTop.kids || []) : [];
      var kidId = reuseId(pool, name, cur.kids.length) || uid("k");
      var prev = pool.filter(function(x){ return x.id === kidId; })[0] || {};
      cur.kids.push({id:kidId, name:name, photoId:prev.photoId || "", chunk:prev.chunk, url:prev.url || ""});
    }
  });
  return out.length ? out : existing;
}

/* ===================== constants ===================== */
var PAGE_SIZE = 25, CHUNK_CAP = 380000;
var SIZES = {small:{px:700,q:0.50,kb:40}, standard:{px:900,q:0.55,kb:70}, detailed:{px:1600,q:0.72,kb:250}};

/* ===================== device storage ===================== */
var store = (function(){
  var haveIDB = typeof indexedDB !== "undefined" && indexedDB !== null, dbp = null;
  function open(){
    return dbp || (dbp = new Promise(function(res, rej){
      var rq = indexedDB.open("furniture-manifest", 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore("kv"); };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    }));
  }
  function tx(mode, fn){
    return open().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction("kv", mode), rq = fn(t.objectStore("kv"));
        rq.onsuccess = function(){ res(rq.result); };
        rq.onerror = function(){ rej(rq.error); };
      });
    });
  }
  return {
    get: function(key){
      if (haveIDB) return tx("readonly", function(os){ return os.get(key); })
        .then(function(v){ return v === undefined ? null : {key:key, value:v}; });
      return window.storage.get(key, true);
    },
    set: function(key, value){
      if (haveIDB) return tx("readwrite", function(os){ return os.put(value, key); })
        .then(function(){ return {key:key, value:value}; });
      return window.storage.set(key, value, true);
    }
  };
})();

var CODES = {
  "GASTON-FAMILY":{plan:"family", months:0,  credits:10, once:true,
                   label:"10 jobs and unlimited items, nothing expires"},
  "MOVEIT-FREE":  {plan:"move",   months:12, credits:0,  label:"one move job, free for a year"},
  "MOVEIT-CREW":  {plan:"pack",   months:12, credits:5,  label:"a pack of 5 jobs"},
  "MOVEIT-KEEP":  {plan:"keeper", months:0,  credits:0,  label:"a Keeper account"}
};
function redeem(raw){
  var code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  var hit = null;
  Object.keys(CODES).forEach(function(k){
    if (k.replace(/[^A-Z0-9]/g, "") === code) hit = k;
  });
  if (!hit) return null;
  var c = CODES[hit];
  /* A one-time code is spent on redemption. The record rides with the account,
     so it carries to the other phone too and cannot be entered twice. */
  account.used = account.used || {};
  if (c.once && account.used[hit]) return {spent:true, label:c.label};
  activate(c.plan, c.months, c.credits);
  if (c.once) account.used[hit] = Date.now();
  account.code = hit;
  saveMeta(true);
  saveGlobal();
  return c;
}

/* ===================== Supabase =====================
   Everything saves on this device first. A Supabase project you own is the
   copy that lets a second phone join: both use the same project URL and key,
   so whoever you send the setup link to is working on the same list. */
var cfg = {url:"", key:"", acct:""};
var BUCKET = "photos";
var photoUrls = {};
/* Opened from a view link: one job, read only, no project key at all. */
var viewOnly = false, viewJobKey = "";
/* Written while loading, read once by firstRun() to decide whether this
   device still has to be asked which job it is joining. */
var cloudHadAccount = false, cloudHadManifest = false, deviceHasData = false, needsChooser = false;

function ckConfigured(){ return !!(cfg.url && cfg.key); }
function cloudOn(){ return ckConfigured(); }
function readOnly(){ return viewOnly; }
function randKey(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,10) +
         Math.random().toString(36).slice(2,10);
}
/* Each job lives in its own unguessable folder, so a link to one job
   reaches nothing else in the bucket. */
function jobKeyOf(j){ return (j && j.key) || ""; }
function jobFolder(){
  if (viewOnly) return "j-" + viewJobKey;
  var k = jobKeyOf(currentJob());
  return k ? "j-" + k : "";          /* empty means the old flat layout */
}
function acctFolder(){ return cfg.acct ? "a-" + cfg.acct : ""; }
function pubUrl(name){ return cfg.url + "/storage/v1/object/public/" + BUCKET + "/" + name; }

/* Legacy anon keys are JWTs and want an Authorization header too.
   New sb_publishable_ keys are rejected if sent as a Bearer token. */
function authHeaders(extra){
  var h = Object.assign({apikey: cfg.key}, extra || {});
  if (cfg.key.indexOf("sb_") !== 0) h.Authorization = "Bearer " + cfg.key;
  return h;
}
function dataUrlToBlob(d){
  var parts = String(d).split(","), m = parts[0].match(/:(.*?);/);
  var bin = atob(parts[1] || ""), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: m ? m[1] : "image/jpeg"});
}

async function cloudPut(name, body, type){
  var r = await fetch(cfg.url + "/storage/v1/object/" + BUCKET + "/" + name, {
    method:"POST",
    headers: authHeaders({"Content-Type":type, "x-upsert":"true"}),
    body: body
  });
  if (!r.ok){
    var t = await r.text();
    throw new Error(r.status + " " + t.slice(0, 90));
  }
  return true;
}
async function cloudGet(name){
  var r = await fetch(pubUrl(name) + "?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) return null;
  return r.text();
}
function cloudDelete(name){
  return fetch(cfg.url + "/storage/v1/object/" + BUCKET + "/" + name,
    {method:"DELETE", headers: authHeaders({})}).catch(function(){});
}

/* One file per job, so two jobs never overwrite each other.
   Job 1 keeps the original names so an existing project still opens. */
function ckName(kind, extra){
  if (kind === "account"){
    var a = acctFolder();
    return a ? a + "/account.json" : "account.json";
  }
  if (kind === "manifest"){
    var f = jobFolder();
    if (f) return f + "/manifest.json";
    return jobId === "job1" ? "manifest.json" : "manifest_" + jobId + ".json";   /* legacy */
  }
  return (jobId === "job1" ? "imgs_" : "imgs_" + jobId + "_") + extra + ".json";
}
function ckType(){ return "application/json"; }
async function ckStart(){ return ckConfigured() ? "on" : "off"; }
async function ckPut(name, type, text){
  return cloudPut(name, new Blob([text], {type:"application/json"}), "application/json");
}
async function ckGet(name){ return cloudGet(name); }

/* One object per photo. Two people adding photos at the same time never
   collide, because nobody is rewriting a shared batch. */
function photoName(id){
  var f = jobFolder();
  return f ? f + "/p-" + id + ".jpg" : id + ".jpg";   /* no folder = legacy layout */
}
async function pushImage(id){
  if (!cloudOn() || !images[id]) return "";
  if (photoUrls[id]) return photoUrls[id];
  await cloudPut(photoName(id), dataUrlToBlob(images[id]), "image/jpeg");
  photoUrls[id] = pubUrl(photoName(id));
  return photoUrls[id];
}
function setKidUrl(photoId, url){
  allSites().forEach(function(p){
    (p.kids || []).forEach(function(k){ if (k.photoId === photoId) k.url = url; });
  });
}
function setExtraUrl(photoId, url){
  items.forEach(function(it){
    (it.extra || []).forEach(function(x){ if (x.id === photoId) x.url = url; });
  });
}
async function pushPhoto(it){
  if (!cloudOn() || it.url || !images[it.id]) return false;
  try{
    it.url = await pushImage(it.id);
    it.ts = Date.now();
    return true;
  }catch(e){
    qAdd({k:"photo", id:it.id});
    return false;
  }
}
/* Every photo this job owns: pieces, extra shots, room photos, signatures, logo. */
function allPhotoIds(){
  var out = [];
  function add(id){ if (id && images[id] && out.indexOf(id) < 0) out.push(id); }
  items.forEach(function(i){
    add(i.id);
    (i.extra || []).forEach(function(x){ add(x.id); });
  });
  placeRefs().forEach(function(r){ add(r.id); });
  var cj = currentJob();
  [cj.sigpickup, cj.sigdelivery].forEach(function(sg){ if (sg) add(sg.id); });
  if (account.logoId) add(account.logoId);
  return out;
}
async function pushAllPhotos(){
  var n = 0, fail = 0;
  var ids = allPhotoIds();
  for (var i = 0; i < ids.length; i++){
    var id = ids[i];
    if (photoUrls[id]) continue;
    try{
      var url = await pushImage(id);
      var it = items.filter(function(x){ return x.id === id; })[0];
      if (it && !it.url) it.url = url;
      setKidUrl(id, url);
      setExtraUrl(id, url);
      if (account.logoId === id) account.logoUrl = url;
      var cj = currentJob();
      [cj.sigpickup, cj.sigdelivery].forEach(function(sg){ if (sg && sg.id === id) sg.url = url; });
      n++;
    }catch(e){ fail++; }
  }
  if (n){ await saveMeta(true); await saveGlobal(); }
  return {n:n, fail:fail};
}

/* Older saves put every photo in the root of the bucket, so one key saw them all.
   This lifts the open job into its own folder and clears the old copies out. */
function legacyPhotoName(id){ return id + ".jpg"; }
function looksLegacy(it){
  return !!(it.url && it.url.indexOf("/photos/" + it.id + ".jpg") >= 0);
}
function tidyNeeded(){
  if (!cloudOn()) return false;
  if (!jobKeyOf(currentJob())) return true;
  return items.some(looksLegacy);
}
async function tidyIntoFolders(report){
  if (!cloudOn()) return {moved:0, failed:0};
  var j = currentJob();
  if (!j.key){ j.key = randKey(); await saveGlobal(); }
  var moved = 0, failed = 0;
  /* anything the project has but this device does not, fetched from the old path */
  for (var a = 0; a < items.length; a++){
    var it = items[a];
    if (!images[it.id] && looksLegacy(it)){
      try{
        var got = await fetch(it.url);
        if (got.ok){
          var blob = await got.blob();
          images[it.id] = await new Promise(function(res){
            var fr = new FileReader();
            fr.onload = function(){ res(fr.result); };
            fr.onerror = function(){ res(null); };
            fr.readAsDataURL(blob);
          });
        }
      }catch(e){}
    }
  }
  /* only now is it clear what there is to move */
  var ids = allPhotoIds();
  for (var i = 0; i < ids.length; i++){
    var id = ids[i];
    if (!images[id]) continue;
    try{
      delete photoUrls[id];
      var url = await pushImage(id);        /* writes to the new folder */
      var own = items.filter(function(x){ return x.id === id; })[0];
      if (own) own.url = url;
      setKidUrl(id, url);
      setExtraUrl(id, url);
      if (account.logoId === id) account.logoUrl = url;
      await cloudDelete(legacyPhotoName(id));
      moved++;
    }catch(e){ failed++; }
    if (report) report(moved, failed, ids.length);
  }
  await saveMeta(true);
  await saveGlobal();
  /* the manifest now lives in the folder too, so retire the old one */
  if (jobId === "job1") await cloudDelete("manifest.json");
  else await cloudDelete("manifest_" + jobId + ".json");
  return {moved:moved, failed:failed};
}

async function syncNow(){
  if (!cloudOn()) return;
  try { if (merge(await readRemote())) render(); } catch(e){}
  try { await ckPut(ckName("manifest"), ckType(), JSON.stringify(packed())); }
  catch(e){ qAdd({k:"meta", id:"manifest"}); }

/* Anything that cannot reach the project waits here until it can. */
var queue = [], flushing = false;
function qAdd(entry){
  var dup = queue.filter(function(q){ return q.k === entry.k && q.id === entry.id && q.job === jobId; })[0];
  if (!dup) queue.push({k:entry.k, id:entry.id, job:jobId});
  store.set("fm:queue", JSON.stringify(queue)).catch(function(){});
  renderTally();
}
function qDrop(entry){
  queue = queue.filter(function(q){ return !(q.k === entry.k && q.id === entry.id && q.job === entry.job); });
  store.set("fm:queue", JSON.stringify(queue)).catch(function(){});
}
async function qLoad(){
  try { var r = await store.get("fm:queue"); if (r) queue = JSON.parse(r.value) || []; } catch(e){}
}
function clearWarn(){ warned = ""; var b = $("#warn"); if (b) b.hidden = true; }

async function flushQueue(loud){
  if (flushing || !cloudOn() || !queue.length) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  flushing = true;
  if (loud) flag("Syncing…", false);
  var work = queue.slice();
  for (var i = 0; i < work.length; i++){
    var q = work[i];
    if (q.job !== jobId && q.k !== "global") continue;   /* other jobs sync when opened */
    try{
      if (q.k === "photo"){
        if (!images[q.id]){ qDrop(q); continue; }
        var url = await pushImage(q.id);
        var it = items.filter(function(x){ return x.id === q.id; })[0];
        if (it && !it.url){ it.url = url; it.ts = Date.now(); }
        setKidUrl(q.id, url);
        setExtraUrl(q.id, url);
      } else if (q.k === "meta"){
        await ckPut(ckName("manifest"), ckType(), JSON.stringify(packed()));
      } else if (q.k === "global"){
        await ckPut(ckName("account"), ckType(), JSON.stringify(packedGlobal()));
      }
      qDrop(q);
    }catch(e){ break; }
  }
  flushing = false;
  renderTally();
  if (!queue.length){
    clearWarn();
    if (loud) flag("Synced", true);
  }
}

/* ===================== persistence ===================== */
function packed(){ return {items:items, seq:seq, removed:removed, places:places, account:account, job:job, v:3}; }
function packedGlobal(){ return {account:account, jobs:jobs, ts:Date.now()}; }

async function saveGlobal(){
  if (viewOnly) return;
  try { await store.set("fm:global", JSON.stringify(packedGlobal())); } catch(e){}
  if (cloudOn()){
    try{
      await ckPut(ckName("account"), ckType("account"), JSON.stringify(packedGlobal()));
    }catch(e){ qAdd({k:"global", id:"account"}); }
  }
}
async function loadGlobal(){
  var g = null;
  try { var l = await store.get("fm:global"); if (l) g = JSON.parse(l.value); } catch(e){}
  if (cloudOn()){
    try{
      var t = await ckGet(ckName("account"));
      var r = t ? JSON.parse(t) : null;
      if (r){
        cloudHadAccount = true;
        if (!g || (r.ts || 0) > (g.ts || 0)) g = r;
      }
    }catch(e){}
  }
  if (g){
    if (g.account) account = Object.assign({}, account, g.account);
    if (g.jobs && g.jobs.length) jobs = g.jobs;
  }
  if (!jobs.length) jobs = [{id:"job1", key:randKey(), name:"Our move", client:"",
                             createdAt:Date.now(), closed:false}];
  jobs.forEach(function(j){ if (!j.key) j.key = randKey(); });
}

function merge(remote){
  if (!remote) return false;
  var before = JSON.stringify(items);
  removed = Object.assign({}, remote.removed || {}, removed);
  if (remote.account && (remote.account.startedAt || 0) >= (account.startedAt || 0)){
    var keepOnboard = account.onboarded;
    account = Object.assign({}, account, remote.account);
    account.onboarded = keepOnboard || account.onboarded;
  }
  if (remote.job && remote.job.id && !job.id) job = remote.job;
  var isDefault = JSON.stringify(places.sites) === JSON.stringify(DEFAULT_SITES);
  if (remote.places && isDefault) places = normalizePlaces(remote.places);
  else if (remote.rooms && remote.rooms.length && isDefault){
    pendingRooms = remote.rooms.slice();
  }
  var map = new Map(items.map(function(i){ return [i.id, i]; }));
  (remote.items || []).forEach(function(r){
    var mine = map.get(r.id);
    if (!mine) map.set(r.id, r);
    else if ((r.ts || 0) > (mine.ts || 0)) map.set(r.id, Object.assign({}, mine, r));
  });
  items = Array.from(map.values())
    .filter(function(i){ return !removed[i.id]; })
    .map(migrateItem)
    .sort(function(a,b){ return (a.n||0) - (b.n||0); });
  /* An old save carried a flat room list. Put any room no piece used onto
     whichever destination the used rooms landed on. */
  if (pendingRooms && pendingRooms.length){
    var host = null, best = 0;
    listOf("to").forEach(function(sIt){
      var hits = (sIt.kids || []).filter(function(k){
        return pendingRooms.indexOf(k.name) >= 0;
      }).length;
      if (hits > best){ best = hits; host = sIt; }
    });
    if (!host) host = listOf("to").filter(function(sIt){ return (sIt.kids||[]).length; })[0] || findPlace("to", "d-new");
    if (host) pendingRooms.forEach(function(nm){ ensureKid(host, nm); });
    pendingRooms = null;
  }
  /* An older save brought its own place names. The starter sites nobody used
     are just clutter next to them, so take them out. */
  if (adoptedLegacy){
    var defaults = DEFAULT_SITES.map(function(d){ return d.id; });
    var used = {};
    items.forEach(function(i){ if (i.from) used[i.from] = 1; if (i.to) used[i.to] = 1; });
    places.sites = places.sites.filter(function(sIt){
      if (defaults.indexOf(sIt.id) < 0) return true;
      if (used[sIt.id]) return true;
      if (sIt.address || sIt.notes) return true;
      return (sIt.kids || []).some(function(k){ return k.photoId || k.url; });
    });
    if (!places.sites.length) places.sites = clonePlaces(DEFAULT_SITES);
    adoptedLegacy = false;
  }
  seq = Math.max.apply(null, [seq, remote.seq || 0].concat(items.map(function(i){ return i.n || 0; })));
  return JSON.stringify(items) !== before;
}
function legacyManifestName(){
  return jobId === "job1" ? "manifest.json" : "manifest_" + jobId + ".json";
}
/* Same two paths, but for any job rather than the one that is open. The job
   chooser uses these to count pieces before you commit to opening one. */
function manifestNameFor(j){
  var k = jobKeyOf(j);
  if (k) return "j-" + k + "/manifest.json";
  return j.id === "job1" ? "manifest.json" : "manifest_" + j.id + ".json";
}
function legacyManifestNameFor(j){
  return j.id === "job1" ? "manifest.json" : "manifest_" + j.id + ".json";
}
async function jobCountRemote(j){
  if (!cloudOn()) return null;
  try{
    var t = await ckGet(manifestNameFor(j));
    if (!t && jobKeyOf(j)) t = await ckGet(legacyManifestNameFor(j));
    if (!t) return null;
    var d = JSON.parse(t);
    return (d.items || []).filter(function(i){ return !i.demo; }).length;
  }catch(e){ return null; }
}
function readRemote(){
  if (!cloudOn()) return Promise.resolve(null);
  return ckGet(ckName("manifest")).then(function(t){
    if (t){ try { return JSON.parse(t); } catch(e){ return null; } }
    /* Nothing in this job's folder yet. An older save may still be sitting
       in the root of the bucket, so look there before giving up. */
    return ckGet(legacyManifestName()).then(function(old){
      try { return old ? JSON.parse(old) : null; } catch(e){ return null; }
    }).catch(function(){ return null; });
  }).catch(function(){ return null; });
}
async function saveMeta(now){
  if (viewOnly) return;          /* a view link changes nothing, here or in the project */
  clearTimeout(metaTimer);
  async function run(){

        dirty = 0;

      }
    }

function pickChunk(len){
  var ids = Object.keys(chunks).map(Number).sort(function(a,b){ return a-b; });
  for (var i = 0; i < ids.length; i++){
    if (JSON.stringify(chunks[ids[i]]).length + len < CHUNK_CAP) return ids[i];
  }
  var next = ids.length ? Math.max.apply(null, ids) + 1 : 0;
  chunks[next] = {};
  return next;
}
async function saveChunk(c){
  if (viewOnly) return true;
  var body = JSON.stringify(chunks[c] || {});
  try{
    await store.set("fm:img:" + c, body);
    var back = await store.get("fm:img:" + c);
    if (!back || back.value.length !== body.length) throw new Error("short write");
    if (cloudOn()){
      try { await ckPut(ckName("imgs", c), ckType("imgs"), body); }
      catch(e){ qAdd({k:"chunk", id:c}); }
    } else if (ckConfigured()) qAdd({k:"chunk", id:c});

    return true;
  }catch(e){
    storageOK = false;
    warn("Photos aren't saving on this device. Tap Save file now so you don't lose them.");
    return false;
  }
}
async function loadChunks(list){
  var extras = [];
  (list || items).forEach(function(i){
    (i.extra || []).forEach(function(x){ extras.push(x); });
  });
  var cj = currentJob();
  [cj.sigpickup, cj.sigdelivery].forEach(function(sg){ if (sg) extras.push(sg); });
  if (account.logoId) extras.push({id:account.logoId, chunk:account.logoChunk, url:account.logoUrl});
  var pool = (list || items).concat(placeRefs()).concat(extras);
  var need = [];
  pool.forEach(function(i){
    var has = i.url || images[i.id];
    if (!has && i.chunk != null && need.indexOf(i.chunk) < 0) need.push(i.chunk);
  });
  for (var i = 0; i < need.length; i++){
    var got = false;
    try{
      var r = await store.get("fm:img:" + need[i]);
      if (r){
        chunks[need[i]] = Object.assign(chunks[need[i]] || {}, JSON.parse(r.value));
        Object.assign(images, chunks[need[i]]);
        got = true;
      }
    }catch(e){}
    if (!got && cloudOn()){
      try{
        var t = await ckGet(ckName("imgs", need[i]));
        if (t){
          chunks[need[i]] = Object.assign(chunks[need[i]] || {}, JSON.parse(t));
          Object.assign(images, chunks[need[i]]);
          store.set("fm:img:" + need[i], t).catch(function(){});
        }
      }catch(e){}
    }
  }
  paintImages();
}

async function load(){
  var h = location.hash.match(/cfg=([^&]+)/);
  if (h){
    try{
      var c = JSON.parse(atob(decodeURIComponent(h[1].split("&")[0])));
      if (c.url && c.key){
        cfg = {url:c.url, key:c.key, acct:c.acct || ""};
        await store.set("fm:cfg", JSON.stringify(cfg));
      }
    }catch(e){}
  }
  try { var sc = await store.get("fm:cfg"); if (sc) cfg = JSON.parse(sc.value); } catch(e){}
  var hj = location.hash.match(/job=([A-Za-z0-9_-]+)/);
  await loadGlobal();
  /* An account record sitting at a guessable path would hand out every job's
     folder key, so move it somewhere only a working link knows about. */
  if (cloudOn() && !viewOnly && !cfg.acct){
    cfg.acct = randKey();
    jobs.forEach(function(j){ if (!j.key) j.key = randKey(); });
    try { await store.set("fm:cfg", JSON.stringify(cfg)); } catch(e){}
    try{
      await ckPut(ckName("account"), ckType(), JSON.stringify(packedGlobal()));
      await cloudDelete("account.json");
    }catch(e){}
  }
  try { var lj = await store.get("fm:lastjob"); if (lj && lj.value) jobId = lj.value; } catch(e){}
  try { var js2 = await store.get("fm:jobsort"); if (js2 && js2.value) jobSort = js2.value; } catch(e){}
  if (hj) jobId = hj[1];
  if (!jobs.filter(function(j){ return j.id === jobId; })[0]){
    if (hj) jobs.push({id:hj[1], name:"Shared job", client:"", createdAt:Date.now(), closed:false});
    else jobId = jobs[0].id;
  }
  job = currentJob();
  var hview = location.hash.match(/view=([^&]+)/);
  if (hview){
    try{
      var v = JSON.parse(atob(decodeURIComponent(hview[1])));
      if (v.url && v.job){
        cfg = {url:v.url, key:"", acct:""};
        viewOnly = true; viewJobKey = v.job;
      }
    }catch(e){}
  }
  var hlive = location.hash.match(/live=([A-Za-z0-9_-]+)/);
  var hitem = location.hash.match(/item=([A-Za-z0-9_-]+)/);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  if (hitem) pendingOpenItem = hitem[1];
  if (hlive) pendingJoin = hlive[1];
  try { var so = await store.get("fm:size"); if (so && SIZES[so.value]) sizeChoice = so.value; } catch(e){}
  try {
    var sm = await store.get(metaKeyLocal());
    if (sm){ deviceHasData = true; merge(JSON.parse(sm.value)); }
  } catch(e){}
  var pickedBefore = false;
  try { var pk = await store.get("fm:picked"); pickedBefore = !!(pk && pk.value); } catch(e){}
  var freshDevice = !viewOnly && !hj && !hview && !pickedBefore && !deviceHasData;
  fillBulk();
  render();
  if (viewOnly){
    jobs = [{id:"view", key:viewJobKey, name:"Shared list", client:"", createdAt:Date.now(), closed:false}];
    jobId = "view"; job = jobs[0];
    try{
      var txt = await cloudGet(ckName("manifest"));
      if (txt) merge(JSON.parse(txt));
    }catch(e){}
    fillBulk(); render();
    warn("You are viewing a shared list. Photos and rooms are all here, but changes are not saved.");
  } else if (cloudOn()){
    var pulled = await readRemote();
    if (pulled){ cloudHadManifest = true; if (merge(pulled)){ fillBulk(); render(); } }
  }
  /* A device that has never been here, landing on a project that already holds
     something, is asked which job it is joining rather than being dropped into
     whichever one happens to be first in the list. */
  needsChooser = cloudOn() && freshDevice && jobs.length > 0 &&
                 (cloudHadAccount || cloudHadManifest);
  /* Working links carry the account folder. One sent before that folder existed
     opens the app but cannot see the shared job list, so anything added on this
     device would quietly go somewhere the others never look. */
  if (cloudOn() && !viewOnly && !cloudHadAccount){
    if (cloudHadManifest){
      warn("This link is out of date. You can read the list, but anything you add here " +
           "may not reach everyone else — ask whoever sent it for a fresh link.");
    } else if (!deviceHasData){
      warn("No shared job list was found at this link. If someone sent it to you, ask them " +
           "for an updated link — otherwise start a job and this project becomes yours.");
    }
  }
  var lost = items.filter(function(i){ return !srcFor(i) && i.chunk != null; }).length;
  if (lost) warn(lost + " photo" + (lost > 1 ? "s" : "") + " didn't come back from storage. If you have a saved file, tap Load file to restore them.");
  await selfTest();
  renderFoot();
  if (pendingOpenItem){
    var target = items.filter(function(i){ return i.id === pendingOpenItem; })[0];
    pendingOpenItem = null;
    if (target) openPiece(target);
  }
  await qLoad();
  flushQueue(false);
  setInterval(function(){ if (!document.hidden && cloudOn()) pull(false); }, 20000);
  setInterval(function(){ if (!document.hidden) flushQueue(false); }, 25000);
  window.addEventListener("online", function(){ flushQueue(true); });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && cloudOn()) pull(false); });
}

/* ===================== plan and limits ===================== */
var DAY = 86400000;
function realItems(){ return items.filter(function(i){ return !i.demo; }); }
function unlimited(){
  if (account.plan === "family" || account.plan === "keeper") return true;
  if (account.plan === "move" || account.plan === "pack")
    return !account.expiresAt || Date.now() < account.expiresAt;
  return false;
}
function roomLeft(){ return unlimited() ? Infinity : Math.max(0, FREE_LIMIT - realItems().length); }
function daysLeft(){
  if (!account.expiresAt) return Infinity;
  return Math.ceil((account.expiresAt - Date.now()) / DAY);
}
function activate(plan, months, credits){
  account.plan = plan;
  account.startedAt = Date.now();
  account.expiresAt = months ? Date.now() + months * 30 * DAY : 0;
  if (credits) account.credits = (account.credits || 0) + credits;
  if (!job.id){ job.id = uid("j"); job.startedAt = Date.now(); }
  account.convertOffered = false;
  saveMeta(true);
  saveGlobal();
  render();
}
function planLine(){
  if (account.plan === "family"){
    var open = jobs.filter(function(j){ return !j.closed && !j.archived; }).length;
    return "Family \u00b7 " + open + " of " + jobsAllowed() + " jobs \u00b7 nothing expires";
  }
  if (account.plan === "keeper") return "Keeper account \u00b7 nothing expires";
  if (account.plan === "move" || account.plan === "pack"){
    var d = daysLeft();
    if (d === Infinity) return "Job open";
    if (d <= 0) return "This job has closed";
    if (d <= 45) return "Job closes in " + d + " day" + (d === 1 ? "" : "s");
    return "Job open \u00b7 " + Math.round(d / 30) + " months left";
  }
  var left = roomLeft();
  return "Free \u00b7 " + left + " of " + FREE_LIMIT + " item" + (left === 1 ? "" : "s") + " left";
}
function checkPlan(){
  $("#jobline").innerHTML = "<b>" + esc(currentJob().name) + "</b><span class=\"chev\">\u25be</span><br>" + esc(planLine());
  if ((account.plan === "move" || account.plan === "pack") && !account.convertOffered){
    var d = daysLeft();
    if (d !== Infinity && d <= 45 && d > -30) offerConvert(d);
  }
}

async function shrink(file){
  var S = SIZES[sizeChoice] || SIZES.standard, bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){
    bmp = await new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){ res(img); };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  var scale = Math.min(1, S.px / Math.max(bmp.width, bmp.height));
  var cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * scale);
  cv.height = Math.round(bmp.height * scale);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  if (bmp.close) bmp.close();
  return cv.toDataURL("image/jpeg", S.q);
}

function stampFor(it){
  if (it.from === BUY_ID && !it.to) return {cls:"buy", txt:"To buy"};
  if (!it.to) return null;
  var top = findPlace("to", it.to);
  if (!top) return null;
  var needsKid = (top.kids||[]).length && !it.toKid;
  return {cls:toneOf(it.to), txt: needsKid ? top.name + " \u00b7 pick room" : nameOf("to", it.to, it.toKid)};
}
function needsSort(it){
  if (!it.to) return true;
  var top = findPlace("to", it.to);
  return !!(top && (top.kids||[]).length && !it.toKid);
}
function counts(){
  var c = {all:items.length, todo:0, buy:0, arrived:0, byDest:{}};
  listOf("to").forEach(function(p){ c.byDest[p.id] = 0; });
  items.forEach(function(it){
    if (needsSort(it)) c.todo++;
    if (it.from === BUY_ID) c.buy++;
    if (it.arrived) c.arrived++;
    if (it.to && c.byDest[it.to] != null) c.byDest[it.to]++;
  });
  return c;
}
function visible(){
  var q = search.trim().toLowerCase();
  return items.filter(function(it){
    if (filter === "todo" && !needsSort(it)) return false;
    if (filter === "buy" && it.from !== BUY_ID) return false;
    if (filterFrom && it.from !== filterFrom) return false;
    if (filterTo){
      var parts = filterTo.split("|");
      if (it.to !== parts[0]) return false;
      if (parts[1] && it.toKid !== parts[1]) return false;
    }
    if (!q) return true;
    return (it.desc||"").toLowerCase().indexOf(q) >= 0
        || (it.contents||"").toLowerCase().indexOf(q) >= 0
        || (it.notes||"").toLowerCase().indexOf(q) >= 0
        || nameOf("to", it.to, it.toKid).toLowerCase().indexOf(q) >= 0
        || String(it.n).padStart(2,"0").indexOf(q) >= 0;
  });
}
function byPlace(list){
  var g = [];
  listOf("to").forEach(function(p){
    if ((p.kids||[]).length){
      p.kids.forEach(function(k){
        var l = list.filter(function(i){ return i.to === p.id && i.toKid === k.id; });
        if (l.length) g.push({head:p.name + " \u2014 " + k.name, kid:k, siteId:p.id, items:l});
      });
      var nr = list.filter(function(i){ return i.to === p.id && !i.toKid; });
      if (nr.length) g.push({head:p.name + " \u2014 room not chosen", kid:null, siteId:p.id, items:nr});
    } else {
      var l2 = list.filter(function(i){ return i.to === p.id; });
      if (l2.length) g.push({head:p.name, kid:null, siteId:p.id, items:l2});
    }
  });
  var none = list.filter(function(i){ return !i.to; });
  if (none.length) g.push({head:"Not sorted yet", kid:null, siteId:"", items:none});
  return g;
}
function lineFor(i){
  var dims = (i.w || i.d || i.h) ? ((i.w||"?") + "\u00d7" + (i.d||"?") + "\u00d7" + (i.h||"?") + " in") : "";
  var from = i.from === BUY_ID ? "to buy" : (i.from ? "from " + nameOf("from", i.from, i.fromKid) : "");
  return [from, dims, Number(i.qty) > 1 ? "qty " + i.qty : "",
          i.flag ? i.flag.toUpperCase() : "", i.notes || ""].filter(Boolean).join(" \u00b7 ");
}
/* Cubic feet from the sizes people already enter, plus a rough truck call. */
function cuft(i){
  var w = parseFloat(i.w), d = parseFloat(i.d), h = parseFloat(i.h);
  if (!w || !d || !h) return 0;
  return (w * d * h / 1728) * Math.max(1, Number(i.qty) || 1);
}
function volume(){
  var total = 0, measured = 0, unmeasured = 0;
  items.forEach(function(i){
    var v = cuft(i);
    if (v){ total += v; measured++; } else unmeasured++;
  });
  return {total:Math.round(total), measured:measured, unmeasured:unmeasured};
}
function truckFor(cf){
  if (!cf) return "";
  if (cf < 350) return "a cargo van or 10-foot truck";
  if (cf < 700) return "a 15-foot truck";
  if (cf < 1000) return "a 17 to 20-foot truck";
  if (cf < 1400) return "a 26-foot truck";
  return "more than one 26-foot truck, or a trailer";
}
function volumeLine(){
  var v = volume();
  if (!v.measured) return "Add sizes to a few pieces and this estimates your truck.";
  var line = "About " + v.total.toLocaleString() + " cu ft from " + v.measured + " measured piece" +
    (v.measured === 1 ? "" : "s") + " \u2014 roughly " + truckFor(v.total) + ".";
  if (v.unmeasured) line += " " + v.unmeasured + " piece" + (v.unmeasured === 1 ? " has" : "s have") + " no size yet, so the real number is higher.";
  return line;
}

function usage(){
  var bytes = 0, withPhoto = 0;
  items.forEach(function(it){
    var d = images[it.id];
    if (d){ bytes += Math.round(d.length * 0.75); withPhoto++; }
  });
  return {bytes:bytes, withPhoto:withPhoto, per: withPhoto ? bytes/withPhoto : 0,
          mb: bytes/1048576, pct: (bytes/1073741824)*100};
}

function pageSlice(){
  var all = visible();
  var pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  if (page >= pages) page = pages - 1;
  if (page < 0) page = 0;
  return {all:all, pages:pages, shown: all.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE)};
}
function renderPager(all, pages){
  var p = $("#pager");
  if (all.length <= PAGE_SIZE){ p.hidden = true; return; }
  p.hidden = false;
  var first = page * PAGE_SIZE + 1;
  var last = Math.min(all.length, first + PAGE_SIZE - 1);
  p.innerHTML =
    '<button class="btn ghost sm" data-pg="prev"' + (page === 0 ? " disabled" : "") + '>\u2039 Back</button>' +
    '<span>' + first + '\u2013' + last + ' of ' + all.length + '</span>' +
    '<button class="btn ghost sm" data-pg="next"' + (page >= pages - 1 ? " disabled" : "") + '>Next \u203a</button>';
}
function loadGroups(list){
  /* Last stop is loaded first, so the first stop comes off the tail of the truck. */
  var g = byPlace(list).filter(function(x){ return x.head !== "Not sorted yet"; });
  g.sort(function(a,b){ return dropOrder(b.siteId) - dropOrder(a.siteId); });
  var rest = byPlace(list).filter(function(x){ return x.head === "Not sorted yet"; });
  return g.concat(rest);
}

/* A clean look at one room: the room itself, then just the pieces.
   No banners, no buttons, nothing to sort — for judging how it goes together. */
function openRoomView(siteId, kidId){
  var site = findPlace("to", siteId);
  if (!site) return;
  var kid = kidId ? findKid("to", siteId, kidId) : null;
  var mine = items.filter(function(i){
    return i.to === siteId && (kidId ? i.toKid === kidId : !i.toKid || !(site.kids||[]).length);
  });
  var withPhoto = mine.filter(function(i){ return srcFor(i); });
  var without = mine.filter(function(i){ return !srcFor(i); });
  var hero = kidPhoto(kid);

  var el = document.createElement("div");
  el.className = "roomview";
  el.innerHTML = '<div class="rv-in">' +
    '<div class="rv-top"><div><h2>' + esc(kid ? kid.name : site.name) + '</h2>' +
      '<div class="sub">' + (kid ? esc(site.name) + " \u00b7 " : "") + mine.length +
      ' piece' + (mine.length === 1 ? "" : "s") + '</div></div>' +
      '<button class="btn" data-close="1">Done</button></div>' +
    (hero ? '<img class="rv-hero" src="' + hero + '" alt="">' : '') +
    (withPhoto.length
      ? '<div class="rv-grid">' + withPhoto.map(function(i){
          return '<button data-piece="' + i.id + '"><img src="' + srcFor(i) + '" alt=""></button>';
        }).join("") + '</div>'
      : '<div class="rv-empty">No photos in this room yet. Add pieces, or add a photo to the ones already here.</div>') +
    (without.length
      ? '<div class="rv-none">Also here, no photo yet: ' + without.map(function(i){
          return '<b>' + String(i.n).padStart(2,"0") + '</b> ' + esc(i.desc || "\u2014");
        }).join(" \u00b7 ") + '</div>'
      : '') +
    '</div>';

  el.addEventListener("click", function(e){
    if (e.target.closest("[data-close]") || e.target === el){ el.remove(); return; }
    var b = e.target.closest("[data-piece]");
    if (!b) return;
    var it = items.filter(function(i){ return i.id === b.dataset.piece; })[0];
    if (!it) return;
    openPiece(it);
  });
  document.body.appendChild(el);
}

/* ===================== interaction ===================== */
function cardClick(e){
  if (viewOnly) return;          /* look, do not touch */
  var el = e.target.closest(".card"); if (!el) return;
  var it = items.filter(function(i){ return i.id === el.dataset.id; })[0];
  if (!it) return;

  if (e.target.closest("[data-addphoto]")){ pendingPhotoFor = it.id; $("#picker").click(); return; }
  if (e.target.closest("[data-arrive]")){
    it.arrived = it.arrived ? 0 : Date.now();
    touch(it); refreshCard(it); saveMeta();
    return;
  }
  if (e.target.closest("[data-pick]")){
    selected.has(it.id) ? selected.delete(it.id) : selected.add(it.id);
    refreshCard(it);
    $("#bulkCount").textContent = selected.size + " selected";
    return;
  }
  if (e.target.closest(".kill")){ removeItems([it]); return; }
  var xa = e.target.closest("[data-xadd]");
  if (xa){
    pendingPhotoFor = null;
    pendingExtra = {id:it.id, tag: xa.dataset.xadd === "condition" ? "condition" : ""};
    $("#picker").click();
    return;
  }
  var rmx = e.target.closest("[data-rmx]");
  if (rmx){
    it.extra = extrasOf(it).filter(function(x){ return x.id !== rmx.dataset.rmx; });
    touch(it); refreshCard(it); saveMeta();
    return;
  }
  var fl = e.target.closest("[data-flag]");
  if (fl){
    it.flag = (it.flag === fl.dataset.flag) ? "" : fl.dataset.flag;
    touch(it); refreshCard(it); saveMeta();
    return;
  }
  var kd = e.target.closest("[data-kind]");
  if (kd){
    it.kind = kd.dataset.kind;
    touch(it); refreshCard(it); saveMeta();
    return;
  }
  if (e.target.closest("[data-dupe]")){ duplicateItem(it); return; }
  if (e.target.closest("[data-more]")){
    expanded.has(it.id) ? expanded.delete(it.id) : expanded.add(it.id);
    refreshCard(it);
    return;
  }
  var f = e.target.closest("[data-from]");
  if (f){
    it.from = (it.from === f.dataset.from) ? "" : f.dataset.from;
    it.fromKid = "";
    touch(it); refreshCard(it); saveMeta(); return;
  }
  var fk = e.target.closest("[data-fromkid]");
  if (fk){
    it.fromKid = (it.fromKid === fk.dataset.fromkid) ? "" : fk.dataset.fromkid;
    touch(it); refreshCard(it); saveMeta(); return;
  }
  var t = e.target.closest("[data-to]");
  if (t){
    it.to = (it.to === t.dataset.to) ? "" : t.dataset.to;
    it.toKid = "";
    touch(it); refreshCard(it); saveMeta(); return;
  }
  var tk = e.target.closest("[data-tokid]");
  if (tk){
    it.toKid = (it.toKid === tk.dataset.tokid) ? "" : tk.dataset.tokid;
    touch(it); refreshCard(it); saveMeta();
    if (filter === "todo" && it.toKid) setTimeout(render, 350);
  }
}
grid.addEventListener("click", cardClick);

function removeItems(list){
  var backup = {items: list.map(function(i){ return Object.assign({}, i); }), images:{}};
  list.forEach(function(i){ if (images[i.id]) backup.images[i.id] = images[i.id]; });
  list.forEach(function(it){
    removed[it.id] = Date.now();
    if (it.chunk != null && chunks[it.chunk]){ delete chunks[it.chunk][it.id]; saveChunk(it.chunk); }
    delete images[it.id];
  });
  var ids = list.map(function(i){ return i.id; });
  items = items.filter(function(i){ return ids.indexOf(i.id) < 0; });
  undoBuf = backup;
  render(); saveMeta();
  toast(list.length === 1 ? "Piece removed" : list.length + " pieces removed", "Undo", undoRemove);
}
function undoRemove(){
  if (!undoBuf) return;
  undoBuf.items.forEach(function(it){
    delete removed[it.id];
    it.ts = Date.now();
    items.push(it);
    var d = undoBuf.images[it.id];
    if (d){
      var c = pickChunk(d.length + 40);
      chunks[c][it.id] = d; images[it.id] = d; it.chunk = c;
      saveChunk(c);
    }
  });
  items.sort(function(a,b){ return (a.n||0) - (b.n||0); });
  undoBuf = null;
  render(); saveMeta();
}

async function addBlankItem(){

  var it = newItem(BUY_ID);
  items.push(it);
  if (boardMode){ boardMode = false; $("#boardBtn").textContent = "Board view"; }
  filter = "buy"; search = ""; $("#find").value = "";
  page = Math.floor(Math.max(0, visible().length - 1) / PAGE_SIZE);
  render();
  await saveMeta(true);
  var d = document.querySelector('.card[data-id="' + it.id + '"] .desc');
  if (d){ d.scrollIntoView({block:"center", behavior:"smooth"}); d.focus(); }
}
function openQuick(){
  openSheet(
    '<h2>Quick capture</h2>' +
    '<p>Walk a room and photograph everything. Each shot lands already assigned, so you can fill in names and sizes later from the sofa.</p>' +
    '<label>Picking up at</label><select id="qcFrom"></select>' +
    '<label>Going to</label><select id="qcTo"></select>' +
    '<div class="row"><button class="btn" id="qcGo">Start shooting</button></div>' +
    (quickFrom || quickTo
      ? '<div class="status ok">Quick capture is on. New photos go to ' +
        esc(quickTo ? nameOf("to", quickTo.split("|")[0], quickTo.split("|")[1]) : "no destination") + '.' +
        '</div><div class="row"><button class="btn ghost" id="qcOff">Turn it off</button></div>'
      : ''),
    function(sh){
      var f = sh.querySelector("#qcFrom"), t = sh.querySelector("#qcTo");
      f.innerHTML = listOf("from").map(function(p){
        return '<option value="' + esc(p.id) + '"' + (quickFrom === p.id ? " selected" : "") + '>' + esc(p.name) + '</option>';
      }).join("");
      t.innerHTML = '<option value="">Decide later</option>' + everyLeaf("to").map(function(l){
        var v = l.top.id + "|" + (l.kid ? l.kid.id : "");
        return '<option value="' + esc(v) + '"' + (quickTo === v ? " selected" : "") + '>' +
          esc(l.kid ? l.top.name + " \u2014 " + l.kid.name : l.top.name) + '</option>';
      }).join("");
      sh.querySelector("#qcGo").addEventListener("click", function(){
        quickFrom = f.value; quickTo = t.value;
        (sh.shut ? sh.shut() : sh.remove());
        render();
        $("#picker").click();
      });
      var off = sh.querySelector("#qcOff");
      if (off) off.addEventListener("click", function(){
        quickFrom = ""; quickTo = "";
        (sh.shut ? sh.shut() : sh.remove());
        toast("Quick capture off");
      });
    });
}

var qrLib = null;
function loadQR(){
  if (qrLib) return Promise.resolve(qrLib);
  if (window.qrcode){ qrLib = window.qrcode; return Promise.resolve(qrLib); }
  /* Never let a missing CDN stop a print. Give it a moment, then carry on without QR. */
  return new Promise(function(res){
    var settled = false;
    function finish(v){ if (!settled){ settled = true; res(v); } }
    setTimeout(function(){ finish(null); }, 2500);
    var sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    sc.onload = function(){ qrLib = window.qrcode || null; finish(qrLib); };
    sc.onerror = function(){ finish(null); };
    document.head.appendChild(sc);
  });
}
function itemLink(id){
  return location.origin + location.pathname + "#job=" + encodeURIComponent(jobId) + "&item=" + encodeURIComponent(id);
}
function qrTag(id){
  if (!qrLib) return "";
  try{
    var q = qrLib(0, "M");
    q.addData(itemLink(id));
    q.make();
    return '<img class="lb-qr" src="' + q.createDataURL(4, 0) + '">';
  }catch(e){ return ""; }
}

function totalValue(){
  var t = 0, n = 0;
  items.forEach(function(i){
    var v = parseFloat(i.value);
    if (v){ t += v * Math.max(1, Number(i.qty) || 1); n++; }
  });
  return {total:t, counted:n};
}

function printLabelsNow(){

  if (!boxes.length){ toast("No boxes yet \u2014 mark a piece as a box first"); return; }
  var out = [];
  boxes.forEach(function(i){
    var n = Math.max(1, Number(i.qty) || 1);
    for (var c = 0; c < n; c++) out.push({i:i, part: n > 1 ? (c+1) + " of " + n : ""});
  });
  $("#printout").innerHTML = '<div class="p-labels">' + out.map(function(o){
    var i = o.i;
    return '<div class="p-label' + (i.flag ? " lb-" + i.flag : "") + '">' +
      '<div class="lb-top"><span class="lb-n">' + String(i.n).padStart(2,"0") + '</span>' +
        (i.flag ? '<span class="lb-flag">' + esc(i.flag) + '</span>' : '') +
        (o.part ? '<span class="lb-part">' + o.part + '</span>' : '') +
        qrTag(i.id) + '</div>' +

      '<div class="lb-desc">' + esc(i.desc || "") + '</div>' +
      '<div class="lb-cont">' + esc(i.contents || "") + '</div>' +
      '<div class="lb-foot">' + esc(currentJob().name) + '</div></div>';
  }).join("") + '</div>';
  window.print();
}

/* ===================== files ===================== */
function buildFile(withPhotos){
  var imgMap = {};
  items.forEach(function(i){
    if (images[i.id]) imgMap[i.id] = images[i.id];
    (i.extra || []).forEach(function(x){ if (images[x.id]) imgMap[x.id] = images[x.id]; });
  });
  placeRefs().forEach(function(r){ if (images[r.id]) imgMap[r.id] = images[r.id]; });
  var cj = currentJob();
  [cj.sigpickup, cj.sigdelivery].forEach(function(sg){
    if (sg && images[sg.id]) imgMap[sg.id] = images[sg.id];
  });
  if (!withPhotos) imgMap = {};
  var payload = JSON.stringify({kind:"furniture-manifest", saved:new Date().toISOString(),
    items:items, seq:seq, removed:removed, places:places, images:imgMap, v:2});
  var sheet = byPlace(items).map(function(g){

/* Roughly what the saved file will weigh, so nobody is surprised by a 40MB email. */
function fileSizeBytes(withPhotos){
  var base = 4000 + items.length * 400;
  if (!withPhotos) return base;
  var photos = 0, held = 0;
  items.forEach(function(i){
    if (images[i.id]){ photos += images[i.id].length; held++; }
    (i.extra || []).forEach(function(x){ if (images[x.id]){ photos += images[x.id].length; held++; } });
  });
  /* photos still in the project get collected on save, so count them too */
  var S = SIZES[sizeChoice] || SIZES.standard;
  /* base64 runs about a third bigger than the jpeg it encodes */
  var each = held ? photos / held : S.kb * 1024 * 1.37;
  return base + photos + missingPhotos().length * each;
}
function fileSizeLabel(withPhotos){
  var b = fileSizeBytes(withPhotos);
  return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1) + " MB";
}
function shareAdvice(){
  var mb = fileSizeBytes(true) / 1048576;
  if (mb < 20) return "Small enough to email, text or drop in a shared folder.";
  if (mb < 60) return "Too big for most email. Send it by AirDrop, or put it in Drive or iCloud and share the link. The list-only file is tiny and emails fine.";
  return "Well past email limits \u2014 use AirDrop or a shared folder link. The list-only file still emails fine.";
}
/* Every photo this device is missing, pulled back from the project so the saved
   file stands on its own. Without this the file is full of links, and the day
   the project goes away so do all the pictures. */
function missingPhotos(){
  var out = [];
  function add(o){ if (o && o.id && !images[o.id] && o.url && out.indexOf(o) < 0) out.push(o); }
  items.forEach(function(i){
    add(i);
    (i.extra || []).forEach(function(x){ add(x); });
  });
  placeRefs().forEach(function(r){ add(r); });
  return out.filter(function(o){ return o.id && o.url; });
}
async function fetchIntoFile(list, onStep){
  var got = 0, missed = 0;
  for (var i = 0; i < list.length; i++){
    var o = list[i];
    if (onStep) onStep(i + 1, list.length);
    try{
      var r = await fetch(o.url);
      if (!r.ok){ missed++; continue; }
      var blob = await r.blob();
      var data = await new Promise(function(res){
        var fr = new FileReader();
        fr.onload = function(){ res(fr.result); };
        fr.onerror = function(){ res(null); };
        fr.readAsDataURL(blob);
      });
      if (data){ images[o.id] = data; got++; } else missed++;
    }catch(e){ missed++; }
  }
  return {got:got, missed:missed};
}

async function doSaveFile(withPhotos){
  if (withPhotos !== false){
    var gaps = missingPhotos();
    if (gaps.length){
      flag("Collecting photos\u2026", false);
      var r = await fetchIntoFile(gaps, function(n, total){
        flag("Collecting photos " + n + " of " + total + "\u2026", false);
      });
      if (r.missed){
        warn(r.missed + " photo" + (r.missed > 1 ? "s" : "") + " could not be collected, so " +
             (r.missed > 1 ? "they are" : "it is") + " saved as a link rather than inside the file. " +
             "Check your connection and save again if you want a file that stands alone.");
      }
    }
  }
  var html = buildFile(withPhotos !== false);
  try{
    var url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
    var a = document.createElement("a");
    a.href = url;
    a.download = (currentJob().name || "manifest").replace(/[^a-z0-9]+/gi, "-").toLowerCase() +
                 (withPhotos === false ? "-list" : "") + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    dirty = 0; renderTally(); flag("File saved", true);
  }catch(e){
    var w = window.open("", "_blank");
    if (w){ w.document.write(html); w.document.close(); }
    else flag("Blocked here — try a computer", false);
  }
}

var sheetsOpen = 0;
function openSheet(html, wire){
  var s = document.createElement("div");
  s.className = "sheet";
  s.innerHTML = '<div class="sheet-in"><button class="close">\u00d7</button>' + html +
    '<button class="btn ghost sheet-done">Done</button></div>';
  function shut(){
    s.dispatchEvent(new Event("sheetclosed"));
    s.remove();
    sheetsOpen = Math.max(0, sheetsOpen - 1);
    if (!sheetsOpen) document.body.classList.remove("locked");
  }
  s.addEventListener("click", function(e){
    if (e.target === s || e.target.classList.contains("close") || e.target.classList.contains("sheet-done")) shut();
  });
  s.shut = shut;
  document.body.appendChild(s);
  sheetsOpen++;
  document.body.classList.add("locked");
  s.scrollTop = 0;
  var inner = s.querySelector(".sheet-in");
  if (inner) inner.scrollTop = 0;
  if (wire) wire(s);
  return s;
}

function jobSortKey(j){
  if (jobSort === "name") return (j.name || "").toLowerCase();
  if (jobSort === "new") return -(j.createdAt || 0);
  var d = j.moveDate ? Date.parse(j.moveDate) : NaN;
  return isNaN(d) ? 8640000000000 : d;     /* no date sinks to the bottom */
}
function sortedJobs(){
  return jobs.slice().sort(function(a,b){
    var ka = jobSortKey(a), kb = jobSortKey(b);
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
}
function moveDateLabel(j){
  if (!j.moveDate) return "No date set";
  var d = Date.parse(j.moveDate + "T12:00:00");
  if (isNaN(d)) return "No date set";
  var days = Math.round((d - Date.now()) / 86400000);
  var when = new Date(d).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
  if (days === 0) return when + " \u00b7 today";
  if (days > 0) return when + " \u00b7 in " + days + " day" + (days === 1 ? "" : "s");
  return when + " \u00b7 " + Math.abs(days) + " day" + (days === -1 ? "" : "s") + " ago";
}
